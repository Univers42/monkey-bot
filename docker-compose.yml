services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monkey-bot
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  qa-runner:
    build:
      context: .
      dockerfile: docker/images/qa-runner/Dockerfile
    env_file:
      - .env
    environment:
      QA_NOTION_BASE_URL: ${QA_NOTION_BASE_URL:-http://host.docker.internal:3002}
      ARTIFACTS_DIR: /app/artifacts
      REPORTS_DIR: /app/reports
      PLAYWRIGHT_DOCKER: "1"
    volumes:
      - ./artifacts:/app/artifacts
      - ./reports:/app/reports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app:
        condition: service_healthy
    init: true
    profiles:
      - qa
