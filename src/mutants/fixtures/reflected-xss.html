<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>mutant: reflected-xss</title>
  </head>
  <body>
    <h1>Mutant — reflected XSS</h1>
    <p>Seeded fault: query <code>q</code> is written with <code>innerHTML</code>.</p>
    <form id="probe-form" action="" method="get">
      <label for="q">q</label>
      <input id="q" name="q" type="text" />
      <button type="submit">Submit</button>
    </form>
    <div id="out"></div>
    <script>
      const params = new URLSearchParams(location.search);
      const q = params.get("q") || "";
      document.getElementById("q").value = q;
      // FAULT (mutant): unsanitized reflection into the DOM
      document.getElementById("out").innerHTML = q;
    </script>
  </body>
</html>
